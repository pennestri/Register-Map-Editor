<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Register Map Editor</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header>
    <h1>Register Map Editor</h1>
    <p class="sub">Define registers and bit fields, then export a YAML register map or import one for editing.</p>
  </header>

  <section class="toolbar">
    <label class="upload">
      <input type="file" id="upload-input" accept=".yaml,.yml,text/yaml,application/x-yaml">
      <span>Upload YAML…</span>
    </label>
    <button type="button" id="add-register" class="primary">+ Add register</button>
    <button type="button" id="clear-all" class="ghost">Clear all</button>
    <a class="navlink" id="nav-settings" href="{{ url_for('settings') }}" title="Address increment, default width, standard-field toggles and custom fields">Settings…</a>
    <span class="spacer"></span>
    <button type="button" id="generate" class="success">Download YAML</button>
  </section>

  <p id="status" class="status" hidden></p>

  <main id="registers" class="registers"></main>

  {% include "_footer.html" %}

  <template id="register-tpl">
    <article class="reg-card" data-role="register">
      <header class="reg-head">
        <span class="reg-index" data-role="index">#1</span>
        <input type="text" data-bind="mnemonic" placeholder="MNEMONIC" class="mnemonic" spellcheck="false">
        <span class="grow"></span>
        <button type="button" class="ghost" data-action="add-bit">+ Bit</button>
        <button type="button" class="danger" data-action="remove-register">Remove</button>
      </header>

      <div class="grid">
        <label>Address
          <input type="text" data-bind="address" placeholder="0x00000000" spellcheck="false">
        </label>
        <label>Width (bits)
          <input type="number" data-bind="width" min="1" max="1024" value="32">
        </label>
        <label>Access
          <select data-bind="access">
            <option value="rw">read &amp; write (rw)</option>
            <option value="r">read only (r)</option>
            <option value="w">write only (w)</option>
          </select>
        </label>
        <label class="span2">Description
          <input type="text" data-bind="description" placeholder="What this register does">
        </label>
        <label>Reset value
          <input type="text" data-bind="reset_value" placeholder="0x0" spellcheck="false">
        </label>
      </div>

      <details class="custom-fields" open>
        <summary>Custom fields</summary>
        <div class="custom-fields-list" data-role="custom-fields"></div>
      </details>

      <details class="bits" open>
        <summary>Bit fields</summary>
        <div class="bit-list" data-role="bits"></div>
      </details>
    </article>
  </template>

  <template id="bit-tpl">
    <div class="bit-row" data-role="bit">
      <label>Pos
        <input type="number" data-bind="position" min="0" value="0">
      </label>
      <label>Width
        <input type="number" data-bind="width" min="1" value="1">
      </label>
      <label>Name
        <input type="text" data-bind="name" placeholder="FIELD" spellcheck="false">
      </label>
      <label>Access
        <select data-bind="access">
          <option value="">— inherit —</option>
          <option value="rw">rw</option>
          <option value="r">r</option>
          <option value="w">w</option>
        </select>
      </label>
      <label class="grow">Description
        <input type="text" data-bind="description" placeholder="Function of this bit/field">
      </label>
      <label>Reset
        <input type="text" data-bind="reset_value" placeholder="0" spellcheck="false">
      </label>
      <button type="button" class="danger" data-action="remove-bit" title="Remove bit">×</button>
    </div>
  </template>

  <script src="{{ url_for('static', filename='core.js') }}"></script>
  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
