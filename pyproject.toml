[project]
name = "register-map-editor"
version = "0.1.0"
description = "Small Flask web app for editing hardware register maps and exporting them as YAML."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "pennestri" }]
dependencies = [
    "Flask>=3.0",
    "PyYAML>=6.0",
]

[project.scripts]
register-map-editor = "app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["app.py", "templates", "static"]
