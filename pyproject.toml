[project]
name = "register-map-editor"
version = "0.2.0"
description = "Local web app for editing hardware register maps and exporting them as YAML."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [
    { name = "Pietro Pennestrì" },
]
dependencies = [
    "Django>=5.2",
    "PyYAML>=6.0",
]

[project.scripts]
register-map-editor = "registermap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["config", "registermap"]
